name: Daily forecast record

on:
  schedule:
    - cron: "13 12 * * *"   # backup only; cron-job.org triggers at 12:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml
          pip install -e . --no-deps

      - name: Record today's forecast
        run: python pipelines/record_forecast.py

      - name: Commit record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          if git diff --cached --quiet; then
            echo "No new record to commit"
          else
            git commit -m "Forecast record $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi