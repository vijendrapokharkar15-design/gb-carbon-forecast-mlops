name: NESO forecast snapshot

on:
  schedule:
    - cron: "52 11 * * *"   # 11:52 UTC daily (GitHub cron is always UTC)
  workflow_dispatch:         # adds a manual "Run workflow" button

permissions:
  contents: write            # needed to commit the snapshot back

concurrency:
  group: neso-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml
          pip install -e . --no-deps

      - name: Take snapshot
        run: python pipelines/snapshot_neso_forecast.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit"
          else
            git commit -m "NESO snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi