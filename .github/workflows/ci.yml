name: CI

on:
  push:
    branches: [main]
    paths-ignore:            # the daily bot commits only touch these: no CI run needed
      - "benchmark/**"
      - "forecasts/**"
      - "monitoring/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read             # CI only reads the code; it never writes to the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push makes an older, still-running check pointless

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q