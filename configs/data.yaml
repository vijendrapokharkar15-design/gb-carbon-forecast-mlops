start_date: "2023-01-01"

neso:
  chunk_days: 30
  pause_seconds: 1.0
  out_dir: data/raw/neso_intensity

weather:
  out_dir: data/raw/weather
  pause_seconds: 1.0
  archive_lag_days: 6          # Open-Meteo archive runs a few days behind
  variables:
    - wind_speed_100m
    - shortwave_radiation
    - cloud_cover
    - temperature_2m
  locations:
    - name: moray_firth          # Scottish offshore cluster (replaces inland scotland_wind)
      latitude: 58.2
      longitude: -2.8
    - name: north_sea            # strongest signal so far
      latitude: 54.0
      longitude: 1.0
    - name: east_anglia          # large southern North Sea offshore cluster
      latitude: 52.3
      longitude: 2.4
    - name: irish_sea            # west coast offshore farms
      latitude: 54.0
      longitude: -3.5
    - name: south_england_solar  # solar
      latitude: 51.0
      longitude: -1.5
    - name: london               # temperature and demand proxy
      latitude: 51.51
      longitude: -0.13

benchmark:
  snapshot_dir: benchmark/neso_fw24h
  min_periods: 46

processed:
  neso_path: data/processed/neso_clean.parquet
  weather_path: data/processed/weather_hourly.parquet
  weather_forecast_path: data/processed/weather_forecast_hourly.parquet


evaluation:
  issue_hour_utc: 12             # forecast issued daily at 12:00 UTC
  horizon_steps: 48              # next 48 half-hours (24h)
  publication_lag_minutes: 30    # latest actual known at issue = period ending 30 min before
  window_steps: 8                # flexible load length: 8 half-hours = 4h
  good_window_threshold: 10      # gCO2/kWh regret counted as a "good" day
  test_start: "2025-10-01"       # walk-forward test year (inclusive)
  test_end: "2026-10-01"         # exclusive
  tuning_start: "2024-10-01"     # tuning year: 2024-10-01 to test_start
  predictions_dir: data/predictions  

features:
  train_start: "2023-02-01"     # 4 weeks after data start, so the profile and 7-day lag exist
  path: data/processed/features.parquet

promotion:
  objective: l1              # chosen on the tuning year (Step 2.5)
  eval_days: 28              # recent window neither model has trained on
  mae_tolerance: 0.5         # challenger may be at most this much worse than champion (gCO2/kWh)
  regret_tolerance: 0.5
  registry_dir: models
  min_eval_days: 7           # skip retraining if less new data than this since the champion

weather_forecast:
  start_date: "2024-03-07"      # archive complete for all variables from here (gaps before 2024-03-06 17:00 UTC)
  lead: previous_day1            # value forecast 24h before each hour
  out_dir: data/raw/weather_forecast_d1
  pause_seconds: 1.0

forecast_record:
  api_url: https://carbon-forecast-api.delightfulfield-1ac7d123.uksouth.azurecontainerapps.io
  out_dir: forecasts
  timeout_seconds: 180        # generous: covers a cold start plus forecast computation
  late_after_minutes: 60      # records fetched later than this after issue are flagged as late