[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-forecast"
version = "0.1.0"
description = "Forecasting GB electricity carbon intensity with a production MLOps pipeline"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: real errors and pyflakes (undefined or unused names, unused imports)
# I: import ordering
# B: bugbear (likely bugs and risky patterns)
select = ["E", "F", "I", "B"]
ignore = ["E501"]   # long lines: readability over a hard limit for now

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query(...) in function defaults is the intended pattern, not a bug
extend-immutable-calls = ["fastapi.Query"]